name: Deploy to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      deployment_target:
        description: Where should this build be served?
        required: true
        default: repository-preview
        type: choice
        options:
          - repository-preview
          - custom-domain

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DEPLOY_BASE_PATH: ${{ inputs.deployment_target == 'repository-preview' && '/eg-website' || '/' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run validate:production
      - name: Build and upload site
        uses: withastro/action@v6

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
